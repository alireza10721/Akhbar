name: Build JahanNews APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the logo project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="JahanNews_GitHub_Upload_LOGO.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in the repository root."
            ls -la
            exit 1
          fi

          mkdir -p /tmp/jahannews
          unzip -q "$ZIP_FILE" -d /tmp/jahannews

          if [ ! -f /tmp/jahannews/settings.gradle.kts ] || [ ! -f /tmp/jahannews/app/build.gradle.kts ]; then
            echo "::error::Expected Android project files were not found inside ZIP."
            find /tmp/jahannews -maxdepth 3 -type f | sort
            exit 1
          fi

          cp -R /tmp/jahannews/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
