name: Build JahanNews APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'JahanNews_GitHub_Upload.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract uploaded project ZIP
        run: |
          mkdir -p /tmp/jahannews
          unzip -q JahanNews_GitHub_Upload.zip -d /tmp/jahannews
          cp -R /tmp/jahannews/. .
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-APK
          path: app/build/outputs/apk/debug/app-debug.apk
