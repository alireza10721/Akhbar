
name: Build JahanNews APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'JahanNews_GitHub_Upload*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::JahanNews project ZIP not found in repository root"
            ls -la
            exit 1
          fi

          echo "Project ZIP found: $ZIP_FILE"

          mkdir -p /tmp/jahannews
          unzip -q "$ZIP_FILE" -d /tmp/jahannews

          PROJECT_DIR="$(find /tmp/jahannews -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found inside ZIP"
            find /tmp/jahannews -maxdepth 3 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cp -R "$PROJECT_DIR"/. .

          if [ ! -d app ]; then
            echo "::error::app folder not found"
            ls -la
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
