
name: Build JahanNews APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | sort | head -n 1 || true)"

          if [[ -n "$ZIP" ]]; then
            mkdir -p _project
            unzip -oq "$ZIP" -d _project

            if [[ ! -f _project/settings.gradle.kts && ! -f _project/settings.gradle ]]; then
              SETTINGS="$(find _project -mindepth 2 -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1 || true)"

              if [[ -n "$SETTINGS" ]]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
                cp -a "$PROJECT_DIR"/. .
              fi
            else
              cp -a _project/. .
            fi
          fi

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-v1.5-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
