
name: Build JahanNews APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | sort | head -n 1 || true)"

          if [[ -n "$ZIP" ]]; then
            mkdir -p _project
            unzip -oq "$ZIP" -d _project

            if [[ -f _project/settings.gradle.kts || -f _project/settings.gradle ]]; then
              cp -a _project/. .
            else
              SETTINGS="$(find _project -mindepth 2 -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1 || true)"
              if [[ -z "$SETTINGS" ]]; then
                echo "Could not find settings.gradle or settings.gradle.kts inside ZIP"
                exit 1
              fi
              PROJECT_DIR="$(dirname "$SETTINGS")"
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in $SDK/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-v1.5-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
