name: Build JahanNews APK

on:
  push:
    paths:
      - 'JahanNews_GitHub_Upload_LOGO.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="JahanNews_GitHub_Upload_LOGO.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in repository root."
            ls -la
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jahannews
          unzip -q JahanNews_GitHub_Upload_LOGO.zip -d /tmp/jahannews
          test -f /tmp/jahannews/settings.gradle.kts
          test -f /tmp/jahannews/app/build.gradle.kts
          test -f /tmp/jahannews/app/src/main/AndroidManifest.xml
          cp -R /tmp/jahannews/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JahanNews-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
